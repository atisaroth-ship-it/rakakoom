name: collect prices

on:
  schedule:
    # 10:30, 12:30, 14:30, 16:30 Bangkok. GitHub may start these late or skip one under load,
    # so there are several slots; a slot that finds today already collected exits at once.
    - cron: '30 3,5,7,9 * * *'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect today's prices
        run: npm run --silent collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FEED_URLS: ${{ secrets.FEED_URLS }}
          DB_SIZE_LIMIT_MB: ${{ vars.DB_SIZE_LIMIT_MB }}
          # Owner asked on 20 Nov 2026 to stop the LINE / heartbeat alerts of the price collection.
          # To turn them back on: restore LINE_CHANNEL_ACCESS_TOKEN, ADMIN_LINE_USER_ID and HEALTHCHECK_URL from
          # secrets here, drop ALLOW_NO_ALERTS, and bring back the "Alert on job failure" step (see git history).
          ALLOW_NO_ALERTS: '1'
