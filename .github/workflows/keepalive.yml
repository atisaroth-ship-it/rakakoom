name: keepalive

# GitHub disables scheduled workflows in a public repo after 60 days without repository activity.
# Once a month, if the last commit is older than 45 days, push an empty commit.
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit when the repo has been quiet
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ($(date +%s) - last) / 86400 ))
          echo "last commit ${age_days} days ago"
          if [ "$age_days" -ge 45 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'chore: keepalive for scheduled workflows'
            git push
          fi
