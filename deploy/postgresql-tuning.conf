# RakaKoom: copy to /etc/postgresql/16/main/conf.d/rakakoom.conf
# 12 GB VM. shared_buffers keeps memory use above 20% at all times, so Oracle never
# classes the VM as idle (its reclaim rule needs CPU, network AND memory under 20% for 7 days).
shared_buffers = 3GB
effective_cache_size = 6GB
work_mem = 64MB
maintenance_work_mem = 512MB
# The daily apply writes millions of rows in one transaction.
max_wal_size = 8GB
checkpoint_timeout = 15min
