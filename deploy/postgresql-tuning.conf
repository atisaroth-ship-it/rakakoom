# RakaKoom: copy to /etc/postgresql/16/main/conf.d/rakakoom.conf
# Google Cloud e2-micro: 1 GB RAM (plus a 2 GB swap file from setup.sh), 30 GB disk shared with the OS.
shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
# The daily apply writes millions of rows in one transaction; keep WAL bounded on the small disk.
max_wal_size = 2GB
checkpoint_timeout = 15min
max_connections = 20
